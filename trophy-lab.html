<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Trophy material lab</title><style>body{background:#101216;color:#e8e9ec;font:15px system-ui;margin:30px}h1{font-size:28px}h2{margin-top:32px}section{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}article{background:#191c22;border:1px solid #30343c;border-radius:8px;padding:14px;text-align:center}svg{width:100%;height:220px}small{color:#aab0ba}input{background:#222630;color:white;border:1px solid #555;padding:8px;margin:5px} </style><h1>Trophy material lab</h1><p>Тестовая галерея существующих форм. Без внешнего сияния Major и дополнительного блика PGL.</p><label>Город <input id="city" value="BUCHAREST"></label><label>Год <input id="year" value="2027"></label><label>Сезон EPL <input id="season" value="24"></label><main id="gallery"></main><script src="js/data/trophy-arts.js"></script><script src="js/awards/trophy-forge.js"></script><script>
const groups=[
['PGL — обычные турниры','pglLattice','PGL',[['Chrome / Sapphire','chrome','blue'],['Gold / Obsidian','gold','smoke'],['Titanium / Ruby','blacktitan','ruby'],['Silver / Emerald','silver','mint']]],
['PGL — корона','pglCrown2','PGL',[['Gold','gold','amber'],['Platinum','silver','ice'],['Black titanium','blacktitan','smoke']]],
['PGL — рельеф','pglPlaque','PGL',[['Gold','gold','violet'],['Gunmetal','gunmetal','blue'],['Champagne','pale','smoke']]],
['CS Asia Championships','cacCup','CAC',[['Silver','silver'],['Titanium','titanium'],['Black steel','blacktitan']]],
['IEM — чаша с ручками','iemClassic','IEM',[['Chrome','chrome'],['Silver','silver'],['Blue steel','bluesteel']]],
['ESL Pro League','eplTower','EPL',[['Black / Gold','gold',null,'black'],['Gunmetal','gold',null,'gunmetal'],['Dark titanium','gold',null,'blacktitan']]],
['IEM — диск','iemPlate','IEM',[['Silver','silver'],['Steel','steel'],['Black titanium','blacktitan']]],
['IEM — кольцевая чаша','ringChalice','IEM',[['Chrome','chrome'],['Titanium','titanium'],['Gunmetal','gunmetal']]],
['PGL Major — призма','pglPrism','PGL',[['Silver / Amber','silver','yellow'],['Black titanium / Ruby','blacktitan','ruby'],['Chrome / Sapphire','chrome','blue']]],
['PGL Major — щит','pglMajor','PGL',[['Gold','gold'],['Platinum','silver'],['Black gold','blackgold']]]
];
function render(){gallery.replaceChildren();for(const [name,d,org,palettes] of groups){const h=document.createElement('h2');h.textContent=name;gallery.append(h);const row=document.createElement('section');gallery.append(row);for(const [label,metal,glass,body] of palettes){const card=document.createElement('article');row.append(card);const title=org==='EPL'?'ESL PRO LEAGUE SEASON '+season.value:org==='CAC'?'CS ASIA CHAMPIONSHIPS':org+' '+city.value;try{card.innerHTML=CS2TrophyForge.draw({d,org,title,year:year.value,metal,glass,body,clean:true,major:d==='pglMajor'||d==='pglPrism'});}catch(e){card.textContent='Ошибка: '+e.message}const t=document.createElement('div');t.textContent=label;card.append(t);}}}document.querySelectorAll('input').forEach(e=>e.addEventListener('input',render));render();
</script></html>
