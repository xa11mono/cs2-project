<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>CS2 Trophy Studio</title><style> *{box-sizing:border-box}body{background:#101114;color:#e8e9ec;font:15px system-ui;margin:24px}h1{font-size:28px}header{display:flex;flex-wrap:wrap;gap:12px;align-items:end}label{display:grid;gap:5px;color:#b8bdc6}input,select,button{background:#22262d;color:white;border:1px solid #454b55;padding:9px;border-radius:5px;font:inherit}button{cursor:pointer}section{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-top:20px}article{background:#191c22;border:1px solid #30343c;border-radius:8px;padding:14px;text-align:center;min-width:0}svg{width:100%;height:230px;display:block}small{color:#aab0ba}article button{margin:8px 3px 0}h2{font-size:19px}#swatches{display:flex;gap:8px;margin-top:12px}.note{color:#aab0ba;max-width:900px}</style><h1>CS2 Trophy Studio</h1><p class="note">Рабочие SVG из генератора проекта. Фиксированная геометрия, процедурные палитры. Названия будущих событий — примеры, не исторические сведения.</p><header><label>Форма<select id="shape"></select></label><label>Город / название<input id="city" value="Bucharest"></label><label>Год<input id="year" type="number" value="2027"></label><label>Сезон EPL<input id="season" type="number" value="24"></label><label>Seed сохранения<input id="seed" value="career-1"></label><label>Отделка<select id="finish"></select></label><button id="random">Новое сохранение</button><button id="export">Экспорт спецификаций JSON</button></header><p id="info"></p><section id="gallery"></section><script src="js/data/trophy-arts.js"></script><script src="js/awards/trophy-forge.js"></script><script>
'use strict';
const forms=[['pglLattice','PGL — пламя','PGL'],['pglCrown2','PGL — корона','PGL'],['pglPlaque','PGL — рельеф','PGL'],['pglPrism','PGL Major — призма','PGL'],['pglMajor','PGL Major — щит','PGL'],['cacCup','CS Asia Championships','CAC'],['iemClassic','IEM — чаша с ручками','IEM'],['ringChalice','IEM — кольцевая чаша','IEM'],['iemPlate','IEM — диск','IEM'],['eplTower','ESL Pro League','EPL'],['blastTri','BLAST — гладкий треугольник','BLAST'],['@blastCarbon','BLAST — рифлёный треугольник','BLAST'],['ewcPlate','Esports World Cup','EWC'],['fissure','Кристалл с коронами (FISSURE в базе)','FISSURE'],['xseTower','XSE — башня (название в базе)','XSE'],['thunderSwirl','Thunderpick World Championship','Thunderpick'],['orbBowl','Perfect World — кристалл','PW'],['encSpire','Esports Nations Cup — шпиль','ENC'],['encTwist','Esports Nations Cup — спираль','ENC'],...Object.entries({poty:'Player of the Year',awper:'Sniper of the Year',rifler:'Rifler of the Year',entry:'Entry of the Year',support:'Support of the Year',igl:'IGL of the Year',rookie:'Rookie of the Year',coach:'Coach of the Year',team:'Team of the Year',lurker:'Lurker of the Year',anchor:'Anchor of the Year',utility:'Utility Master',clutch:'Clutch Master',mvp:'Major MVP'}).map(([k,v])=>['!'+k,v,'HLTV'])];
const palettes=[['Champagne / Obsidian','pale','smoke','blacktitan','gold'],['Platinum / Sapphire','silver','blue','gunmetal','chrome'],['Bronze / Emerald','bronze','mint','black','pale'],['Ruby / Titanium','ruby','ruby','blacktitan','silver'],['Gold / Ruby','gold','red','black','gold'],['Black / Ruby','blacktitan','ruby','ruby','blacktitan'],['Amethyst / Silver','violet','violet','gunmetal','silver'],['Copper / Petrol','copper','cyan','black','copper'],['White / Cobalt','white','navy','cobalt','silver'],['Black monochrome','blacktitan','smoke','blacktitan','blacktitan'],['Silver monochrome','silver','ice','silver','silver'],['Gold monochrome','gold','amber','gold','gold'],['Ruby monochrome','ruby','ruby','ruby','ruby'],['Emerald monochrome','emerald','mint','emerald','emerald'],['Deep blue monochrome','cobalt','blue','cobalt','cobalt'],['Rose / Onyx','rose','smoke','black','rose'],['Steel / Amber','steel','amber','gunmetal','gold'],['Teal / Platinum','teal','cyan','blacktitan','silver'],['Graphite / Champagne','gunmetal','amber','black','pale'],['Ivory / Bronze','white','smoke','bronze','bronze']];
const $=id=>document.getElementById(id), shape=$('shape'),finish=$('finish'),gallery=$('gallery');let specs=[];
function opt(el,v,t){const o=document.createElement('option');o.value=v;o.textContent=t;el.append(o)} forms.forEach(([k,l])=>opt(shape,k,l));opt(finish,'all','Все материалы');palettes.forEach((p,i)=>opt(finish,String(i),p[0]));
function hash(s){let h=2166136261;for(const c of s){h=Math.imul(h^c.charCodeAt(0),16777619)}return h>>>0}
function make(f,p){const [d,label,org]=f,[palette,metal,glass,body,metal3]=p;const title=org==='EPL'?'ESL PRO LEAGUE SEASON '+$('season').value:org==='CAC'?'CS ASIA CHAMPIONSHIPS':org==='Thunderpick'?'THUNDERPICK WORLD CHAMPIONSHIP':org+' '+$('city').value.toUpperCase();return {d:d.startsWith('@')?'blastTri':d,artKey:d.startsWith('@')?d.slice(1):undefined,award:d.startsWith('!')?d.slice(1):undefined,org,title,year:$('year').value,metal,glass,body,metal2:metal3,metal3,clean:true,labPalette:true,major:d==='pglPrism'||d==='pglMajor',palette,seed:$('seed').value}}
function renderSVG(s){return s.award?CS2TrophyForge.statueAward(s.award,s.year,s):CS2TrophyForge.draw(s)}
function download(name,content,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000)}
async function exportSVG(svg,name){const clone=svg.cloneNode(true);for(const use of clone.querySelectorAll('use')){const id=use.getAttribute('href');if(!id||!id.startsWith('#'))continue;const symbol=document.getElementById(id.slice(1));if(!symbol)continue;const nested=document.createElementNS('http://www.w3.org/2000/svg','svg');for(const attr of ['x','y','width','height','style'])if(use.hasAttribute(attr))nested.setAttribute(attr,use.getAttribute(attr));nested.setAttribute('viewBox',symbol.getAttribute('viewBox')||'5 1 54 71');nested.innerHTML=symbol.innerHTML;use.replaceWith(nested)}for(const img of clone.querySelectorAll('image')){const href=img.getAttribute('href');if(!href||href.startsWith('data:'))continue;const blob=await fetch(href).then(r=>{if(!r.ok)throw Error('Asset missing');return r.blob()});const data=await new Promise((res,rej)=>{const reader=new FileReader();reader.onload=()=>res(reader.result);reader.onerror=rej;reader.readAsDataURL(blob)});img.setAttribute('href',data)}download(name+'.svg',new XMLSerializer().serializeToString(clone),'image/svg+xml')}
function render(){gallery.replaceChildren();specs=[];const f=forms.find(x=>x[0]===shape.value);const index=hash($('seed').value+'|'+f[0]+'|'+$('city').value+'|'+$('year').value+'|'+$('season').value)%palettes.length;const order=finish.value==='all'?palettes.map((_,i)=>(i+index)%palettes.length):[Number(finish.value)];$('info').textContent='Вариант сохранения: '+palettes[index][0]+' · '+order.length+' отделок · пропорции фиксированы';for(const i of order){const s=make(f,palettes[i]);specs.push(s);const card=document.createElement('article');gallery.append(card);try{card.innerHTML=renderSVG(s)}catch(e){card.textContent='Ошибка: '+e.message;continue}const t=document.createElement('div');t.textContent=s.palette;card.append(t);const b=document.createElement('button');b.textContent='SVG';b.onclick=()=>exportSVG(card.querySelector('svg'),f[0].replace(/[^a-zA-Z0-9]/g,'')+'-'+i).catch(e=>alert('Запустите через локальный HTTP-сервер: '+e.message));card.append(b)}}
document.querySelectorAll('input,select').forEach(e=>e.addEventListener('change',render));$('random').onclick=()=>{$('seed').value=crypto.getRandomValues(new Uint32Array(2)).join('-');render()};$('export').onclick=()=>download('trophy-specs.json',JSON.stringify(specs,null,2),'application/json');render();
</script></html>
