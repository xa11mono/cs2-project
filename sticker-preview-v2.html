<!doctype html><html lang="ru"><meta charset="utf-8"><title>Sticker generator V2</title><style>body{background:#101722;color:#e7edf5;font:15px Arial;margin:24px}section{display:grid;grid-template-columns:repeat(5,minmax(100px,1fr));gap:10px}article{background:#202a38;border:1px solid #344152;border-radius:9px;text-align:center;padding:8px}svg{width:100%;max-width:230px;display:block;margin:auto}small{color:#aab6c6}button,select{padding:8px;background:#293749;color:white;border:1px solid #59697d}</style><h1>Major Sticker Generator V2</h1><p>Локальные логотипы и шрифты. Наведи мышь на Holo.</p><label>Команда <select id="team"><option>FaZe</option><option>NAVI</option><option>Team Spirit</option><option>GamerLegion</option><option>Team Vitality</option></select></label> <label>Автограф <input id="nick" value="rain"></label> <button id="go">Показать</button><div id="out"></div><script src="js/fan/sticker-art.js"></script><script src="js/fan/stickers-v2/themes.js"></script><script src="js/fan/stickers-v2/signatures.js"></script><script src="js/fan/stickers-v2/materials.js"></script><script src="js/fan/stickers-v2/composer.js"></script><script>window.V31Media={url:(_,name)=>'assets/media/teams/'+name.toLowerCase().replace(/[^a-z0-9]/g,'')+'.webp'};</script><script src="js/fan/stickers.js"></script><script>function draw(){const S=window.CS2Stickers,team=document.querySelector('#team').value,nick=document.querySelector('#nick').value,out=document.querySelector('#out');out.replaceChildren();for(const name of ['IEM Cologne Major 2026','PGL Major Singapore 2026','IEM Cologne Major 2025']){const m={name},h=document.createElement('h2');h.textContent=name;out.append(h);const grid=document.createElement('section');for(const kind of ['event','team','auto'])for(const finish of ['paper','foil','glitter','holo','gold']){const a=document.createElement('article');a.innerHTML=kind==='event'?S.eventSticker(m,finish):kind==='team'?S.teamSticker(m,team,finish):S.autograph(m,nick,team,finish);const b=document.createElement('small');b.textContent=kind+' · '+finish;a.append(b);grid.append(a)}out.append(grid)}}document.querySelector('#go').onclick=draw;draw();</script></html>
